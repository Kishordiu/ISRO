<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto">
  <defs>
    <!-- Deep Space Interstellar Gradients -->
    <radialGradient id="spaceVoid" cx="70%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="40%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Tiranga & Solar Telemetry Flare Gradients -->
    <radialGradient id="solarFlare" cx="78%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020408" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cosmicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#1E3A5F" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="telemetryBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Starfield Pattern -->
    <pattern id="starfield" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="25" r="0.7" fill="#E2E8F0" opacity="0.4" />
      <circle cx="65" cy="85" r="1.1" fill="#FFFFFF" opacity="0.6" />
      <circle cx="95" cy="35" r="0.5" fill="#38BDF8" opacity="0.5" />
      <circle cx="40" cy="110" r="0.8" fill="#FBBF24" opacity="0.5" />
      <circle cx="110" cy="90" r="0.6" fill="#FFFFFF" opacity="0.3" />
      <circle cx="80" cy="15" r="0.9" fill="#93C5FD" opacity="0.5" />
    </pattern>

    <!-- Keyframe Motion Animations -->
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbitTrajectory {
        0% { transform: rotate(0deg) scaleY(0.48); }
        100% { transform: rotate(360deg) scaleY(0.48); }
      }
      @keyframes apoapsisPulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes telemetryBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes downlinkPing {
        0% { r: 6px; opacity: 1; }
        100% { r: 38px; opacity: 0; }
      }
      @keyframes satelliteFloat {
        0% { transform: translate(0, 0); }
        50% { transform: translate(-4px, -6px); }
        100% { transform: translate(0, 0); }
      }

      .radar-sweep {
        transform-origin: 730px 160px;
        animation: radarSweep 12s linear infinite;
      }
      .orbit-path-1 {
        transform-origin: 730px 160px;
        animation: orbitTrajectory 20s linear infinite;
      }
      .orbit-path-2 {
        transform-origin: 730px 160px;
        animation: orbitTrajectory 32s reverse linear infinite;
      }
      .pulse-core {
        transform-origin: 730px 160px;
        animation: apoapsisPulse 4s ease-in-out infinite;
      }
      .ping-wave {
        animation: downlinkPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .telemetry-live {
        animation: telemetryBlink 1.8s ease-in-out infinite;
      }
      .satellite-craft {
        animation: satelliteFloat 6s ease-in-out infinite;
      }

      .mission-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist Sans", sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
        fill: #F8FAFC;
      }
      .mono-code {
        font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Deep Cosmos Background Plate -->
  <rect width="960" height="320" rx="24" fill="url(#spaceVoid)" />
  <rect width="960" height="320" rx="24" fill="url(#starfield)" />
  <rect width="960" height="320" rx="24" fill="url(#solarFlare)" />

  <!-- Outer Tactile Aerospace Frame -->
  <rect x="2" y="2" width="956" height="316" rx="22" fill="none" stroke="url(#cosmicBorder)" stroke-width="1.8" />
  
  <!-- Glass Reflection Upper Bevel -->
  <path d="M 30 6 L 930 6" stroke="#93C5FD" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" />

  <!-- ==================== AEROSPACE TELEMETRY & RADAR SYSTEM ==================== -->

  <!-- Radar Distance Range Rings -->
  <g opacity="0.25">
    <circle cx="730" cy="160" r="130" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="730" cy="160" r="95" fill="none" stroke="#0284C7" stroke-width="1" />
    <circle cx="730" cy="160" r="60" fill="none" stroke="#FF9933" stroke-width="1" stroke-dasharray="2 4" />
    <circle cx="730" cy="160" r="25" fill="none" stroke="#38BDF8" stroke-width="0.8" />
  </g>

  <!-- Radar Coordinate Axes -->
  <line x1="590" y1="160" x2="870" y2="160" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 3" />
  <line x1="730" y1="20" x2="730" y2="300" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 3" />

  <!-- Radar Sweep Beam (Rotating Vector Cone) -->
  <g class="radar-sweep">
    <path d="M 730 160 L 860 115 A 130 130 0 0 1 860 160 Z" fill="url(#telemetryBeam)" opacity="0.35" />
    <line x1="730" y1="160" x2="860" y2="160" stroke="#38BDF8" stroke-width="1.6" opacity="0.9" />
  </g>

  <!-- Orbital Ellipses (Trans-Lunar / Mars Trajectory) -->
  <g class="orbit-path-1">
    <ellipse cx="730" cy="160" rx="145" ry="68" fill="none" stroke="#FF9933" stroke-width="1.4" stroke-dasharray="6 8" opacity="0.75" />
    <!-- Orbiting Satellite Probe -->
    <circle cx="875" cy="160" r="4" fill="#FBBF24" />
  </g>

  <g class="orbit-path-2">
    <ellipse cx="730" cy="160" rx="120" ry="54" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.6" />
    <circle cx="610" cy="160" r="3" fill="#38BDF8" />
  </g>

  <!-- Core Celestial Body / Downlink Station -->
  <g class="pulse-core">
    <circle cx="730" cy="160" r="18" fill="#0C1D38" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="730" cy="160" r="8" fill="#FF9933" />
  </g>
  <!-- Downlink Ping Radiation Rings -->
  <circle cx="730" cy="160" r="6" fill="none" stroke="#38BDF8" stroke-width="1.5" class="ping-wave" />

  <!-- Detailed Satellite Micro-Craft (Aditya/Chandrayaan Silhouette) -->
  <g class="satellite-craft" transform="translate(640, 80)">
    <!-- Central Bus -->
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#FF9933" stroke-width="1.2" />
    <!-- Solar Panels -->
    <rect x="-32" y="-6" width="20" height="12" rx="1" fill="#0284C7" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="-22" y1="-6" x2="-22" y2="6" stroke="#93C5FD" stroke-width="0.8" />
    <rect x="12" y="-6" width="20" height="12" rx="1" fill="#0284C7" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="22" y1="-6" x2="22" y2="6" stroke="#93C5FD" stroke-width="0.8" />
    <!-- High Gain Antenna Dish -->
    <path d="M 0 -8 L 0 -15 M -6 -15 Q 0 -19 6 -15" fill="none" stroke="#FBBF24" stroke-width="1.2" />
  </g>

  <!-- Real-time Mission Telemetry HUD Overlay -->
  <g transform="translate(680, 260)" class="mono-code">
    <rect x="-10" y="-12" width="230" height="42" rx="8" fill="#071220" stroke="#1E3A5F" stroke-width="1" opacity="0.9" />
    <circle cx="2" cy="0" r="3" fill="#10B981" class="telemetry-live" />
    <text x="12" y="3" fill="#38BDF8" font-size="9.5" font-weight="700">DOWNLINK: ACTIVE · 8.4 GHz</text>
    <text x="2" y="19" fill="#94A3B8" font-size="8.5">ALT: 384,400 KM · INC: 28.5° · NOMINAL</text>
  </g>

  <!-- ==================== LEFT EDITORIAL & IDENTITY BLOCK ==================== -->
  <g transform="translate(52, 54)">
    <!-- Mission Badge -->
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#0D1F38" stroke="#1E40AF" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4.5" fill="#FF9933" class="telemetry-live" />
    <text x="28" y="18" fill="#38BDF8" class="mono-code" font-size="11" font-weight="700">AEROSPACE MISSION CONTROL</text>

    <!-- Main Title -->
    <text x="0" y="80" class="mission-title" font-size="46">ISRO WEB EXPERIENCE</text>

    <!-- Subtitle / Mission Doctrine -->
    <text x="0" y="122" fill="#CBD5E1" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      Real-Time Satellite Telemetry, Network Health &amp; AI Incident Command
    </text>

    <!-- Tiranga Ribbon Accent Strip -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="50" height="3" fill="#FF9933" rx="1.5" />
      <rect x="54" y="0" width="50" height="3" fill="#FFFFFF" rx="1.5" opacity="0.9" />
      <rect x="108" y="0" width="50" height="3" fill="#10B981" rx="1.5" />
    </g>

    <!-- Tech Specs Footer Tags -->
    <g transform="translate(0, 182)" class="mono-code" font-size="10.5">
      <rect x="0" y="0" width="118" height="22" rx="6" fill="#0B192C" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="15" fill="#FBBF24">REACT + VITE</text>

      <rect x="128" y="0" width="138" height="22" rx="6" fill="#0B192C" stroke="#1E293B" stroke-width="1" />
      <text x="140" y="15" fill="#38BDF8">FRAMER MOTION</text>

      <rect x="276" y="0" width="128" height="22" rx="6" fill="#0B192C" stroke="#1E293B" stroke-width="1" />
      <text x="288" y="15" fill="#10B981">RECHARTS HUD</text>
    </g>

    <!-- Studio Signature -->
    <g transform="translate(0, 230)">
      <text x="0" y="0" fill="#475569" class="mono-code" font-size="9.5">
        DIU FOUNDRY · VERIFIABLE AEROSPACE TELEMETRY &amp; SYSTEMS DESIGN
      </text>
    </g>
  </g>
</svg>